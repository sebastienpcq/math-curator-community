name: Signaler un bug
description: Signaler un problème rencontré avec Math Curator Community
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Merci pour le signalement. Ne partagez pas de données personnelles ni de clés API."
  - type: textarea
    id: description
    attributes:
      label: Problème rencontré
      description: Que se passe-t-il ?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes pour reproduire
      description: Comment reproduire le problème ?
      placeholder: "1. Ouvrir YouTube
2. Activer l'extension
3. ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Résultat attendu
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Navigateur et version
      placeholder: "Chrome ..."
  - type: input
    id: extension
    attributes:
      label: Version de l'extension
      placeholder: "1.0.0"
  - type: textarea
    id: extra
    attributes:
      label: Informations complémentaires
      description: Captures d'écran ou messages d'erreur (sans informations sensibles).
