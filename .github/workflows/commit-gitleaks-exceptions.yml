name: Commit verified Gitleaks exceptions
on:
  push:
    branches:
      - agent/youtube-client-hardening
    paths:
      - '.github/workflows/commit-gitleaks-exceptions.yml'
permissions:
  contents: write
jobs:
  commit-exceptions:
    if: github.repository == 'seblenonsaint/math-curator-community' && github.ref == 'refs/heads/agent/youtube-client-hardening'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Generate and validate exact fingerprints privately
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          trap 'rm -f /tmp/gitleaks-report.json /tmp/gitleaks-output.log /tmp/gitleaks-candidate /tmp/gitleaks-test.log' EXIT
          VERSION=8.24.3
          curl -fsSL --retry 2 "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tar.gz
          mkdir -p /tmp/gitleaks-bin
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks-bin gitleaks
          set +e
          /tmp/gitleaks-bin/gitleaks git --no-banner --report-format json --report-path /tmp/gitleaks-report.json . >/tmp/gitleaks-output.log 2>&1
          baseline=$?
          set -e
          if [ "$baseline" -ne 1 ]; then echo "::error::Unexpected baseline status"; exit 1; fi
          python3 scripts/prepare-gitleaks-dry-run.py /tmp/gitleaks-report.json /tmp/gitleaks-candidate
          set +e
          /tmp/gitleaks-bin/gitleaks git --no-banner --gitleaks-ignore-path /tmp/gitleaks-candidate . >/tmp/gitleaks-test.log 2>&1
          remaining=$?
          set -e
          if [ "$remaining" -ne 0 ]; then echo "::error::Candidate exclusions did not clear baseline"; exit 1; fi
          if [ -e .gitleaksignore ]; then echo "::error::Existing ignore file; manual review required"; exit 1; fi
          cp /tmp/gitleaks-candidate .gitleaksignore
          chmod 600 .gitleaksignore
          echo "Exact candidate fingerprints verified"
      - name: Commit only to audit branch using GitHub API
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/agent/youtube-client-hardening"
          test "$(wc -l < .gitleaksignore)" -eq 5
          encoded=$(base64 -w 0 .gitleaksignore)
          gh api -X PUT "repos/$GH_REPO/contents/.gitleaksignore" \
            -f message="security: allow five verified historical storage fingerprints" \
            -f content="$encoded" \
            -f branch="agent/youtube-client-hardening" \
            --silent
          echo "Committed five verified exceptions on audit branch"
