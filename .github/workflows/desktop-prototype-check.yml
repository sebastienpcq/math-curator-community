name: Desktop prototype checks

on:
  push:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-prototype-check.yml'
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop-prototype-check.yml'

permissions:
  contents: read

jobs:
  syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check desktop JavaScript syntax
        run: |
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
          node --check desktop/renderer.cjs
          node --test tests/community.test.cjs
