name: Secret scanning (Gitleaks)
on:
  push:
    branches:
      - agent/youtube-client-hardening
  pull_request:
    branches:
      - agent/youtube-live-validation
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test classifier with synthetic fixtures
        run: python3 -m unittest discover -s scripts -p 'test_classify_gitleaks.py'
      - name: Scan full available Git history without disclosing findings
        shell: bash
        run: |
          set -euo pipefail
          VERSION=8.24.3
          curl --fail --silent --show-error --location --retry 2 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            --output /tmp/gitleaks.tar.gz
          mkdir -p /tmp/gitleaks-bin
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks-bin gitleaks
          umask 077
          set +e
          /tmp/gitleaks-bin/gitleaks git --no-banner --report-format json \
            --report-path /tmp/gitleaks-report.json . >/tmp/gitleaks-output.log 2>&1
          result=$?
          set -e
          trap 'rm -f /tmp/gitleaks-report.json /tmp/gitleaks-output.log' EXIT
          if [ "$result" -eq 1 ]; then
            if [ -f /tmp/gitleaks-report.json ]; then
              python3 scripts/classify-gitleaks.py /tmp/gitleaks-report.json || true
              python3 scripts/audit-gitleaks-history.py /tmp/gitleaks-report.json || true
              python3 -c 'import json,re,subprocess,sys; findings=json.load(open(sys.argv[1])); p=subprocess.run(["git","show","4a0fff15d734:knowledge-curator/attempts.cjs"],capture_output=True,check=False); m=re.search(r"const\\s+KEY\\s*=\\s*[\"\x27]([^\"\x27]+)",p.stdout.decode("utf-8","replace")) if p.returncode==0 else None; ok=bool(m) and len(findings)==5 and all(f.get("Secret")==m.group(1) for f in findings); print(json.dumps({"audit":"historical_constant_exact_match","verified":ok,"exceptions_activated":False})); sys.exit(0 if ok else 2)' /tmp/gitleaks-report.json
              python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); e={("4a0fff15d734","knowledge-curator/attempts.cjs"),("149bdd12227d","knowledge-curator/tests/browser.spec.cjs"),("4d5e863a93c6","knowledge-curator/tests/browser.spec.cjs"),("602e38bb00b9","knowledge-curator/tests/browser.spec.cjs"),("be3cacc01a79","knowledge-curator/tests/browser.spec.cjs")}; f=[x.get("Fingerprint") for x in r]; print(json.dumps({"audit":"fingerprint_identity","expected_locations":len(r)==5 and {(str(x.get("Commit",""))[:12],x.get("File")) for x in r}==e,"five_distinct_fingerprints":len(f)==5 and all(isinstance(x,str) and bool(x) for x in f) and len(set(f))==5,"expected_rule":all(x.get("RuleID")=="generic-api-key" for x in r),"exceptions_activated":False}))' /tmp/gitleaks-report.json
            fi
            echo "::error::Gitleaks detected potential secrets; values and locations suppressed"
            exit 1
          elif [ "$result" -ne 0 ]; then
            echo "::error::Gitleaks scan failed (code $result); details suppressed"
            exit "$result"
          fi
          echo "Gitleaks history scan completed without findings"
