name: Secret scanning (Gitleaks)
on:
  push:
    branches:
      - agent/youtube-client-hardening
  pull_request:
    branches:
      - agent/youtube-live-validation
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan full available Git history without disclosing findings
        shell: bash
        run: |
          set -euo pipefail
          VERSION=8.24.3
          curl --fail --silent --show-error --location --retry 2 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            --output /tmp/gitleaks.tar.gz
          mkdir -p /tmp/gitleaks-bin
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks-bin gitleaks
          set +e
          /tmp/gitleaks-bin/gitleaks git --redact --no-banner --report-format json \
            --report-path /tmp/gitleaks-report.json . >/tmp/gitleaks-output.log 2>&1
          result=$?
          set -e
          if [ "$result" -eq 1 ]; then
            if [ -f /tmp/gitleaks-report.json ]; then
              python3 - <<'PY'
              import json, subprocess, collections
              findings=json.load(open('/tmp/gitleaks-report.json'))
              results=collections.Counter()
              for f in findings:
                  path=f.get('File','')
                  commit=f.get('Commit','')
                  secret=f.get('Secret','')
                  line=f.get('StartLine')
                  classification='unverified'
                  if path in ('knowledge-curator/attempts.cjs','knowledge-curator/tests/browser.spec.cjs') and commit and isinstance(line,int) and secret:
                      try:
                          source=subprocess.check_output(['git','show',f'{commit}:{path}'],stderr=subprocess.DEVNULL).decode('utf-8')
                          lines=source.splitlines()
                          matched=lines[line-1] if 0<line<=len(lines) else ''
                          if secret in matched and any(marker in matched for marker in ('localStorage.', 'getItem(', 'setItem(', 'removeItem(', 'const KEY=', 'attemptsKey=', 'progressKey=')):
                              classification='storage-key-candidate'
                      except (subprocess.CalledProcessError,UnicodeDecodeError):
                          pass
                  results[(f.get('RuleID','unknown'),classification)]+=1
              for (rule,classification),count in sorted(results.items()):
                  print(json.dumps({'rule':rule,'classification':classification,'count':count}))
              PY
            fi
            echo "::error::Gitleaks detected potential secrets; values and locations suppressed"
            exit 1
          elif [ "$result" -ne 0 ]; then
            echo "::error::Gitleaks scan failed (code $result); details suppressed"
            exit "$result"
          fi
          echo "Gitleaks history scan completed without findings"
