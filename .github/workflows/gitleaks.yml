name: Secret scanning (Gitleaks)
on:
  push:
    branches:
      - agent/youtube-client-hardening
  pull_request:
    branches:
      - agent/youtube-live-validation
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test classifier with synthetic fixtures
        run: python3 -m unittest discover -s scripts -p 'test_classify_gitleaks.py'
      - name: Scan full available Git history without disclosing findings
        shell: bash
        run: |
          set -euo pipefail
          VERSION=8.24.3
          curl --fail --silent --show-error --location --retry 2 \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            --output /tmp/gitleaks.tar.gz
          mkdir -p /tmp/gitleaks-bin
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp/gitleaks-bin gitleaks
          umask 077
          set +e
          /tmp/gitleaks-bin/gitleaks git --no-banner --report-format json \
            --report-path /tmp/gitleaks-report.json . >/tmp/gitleaks-output.log 2>&1
          result=$?
          set -e
          trap 'rm -f /tmp/gitleaks-report.json /tmp/gitleaks-output.log' EXIT
          if [ "$result" -eq 1 ]; then
            if [ -f /tmp/gitleaks-report.json ]; then
              python3 scripts/classify-gitleaks.py /tmp/gitleaks-report.json || true
              python3 scripts/audit-gitleaks-history.py /tmp/gitleaks-report.json || true
              python3 - /tmp/gitleaks-report.json <<'PY'
              import json, sys
              report=json.load(open(sys.argv[1],encoding='utf-8'))
              expected={
                  ('4a0fff15d734','knowledge-curator/attempts.cjs'),
                  ('149bdd12227d','knowledge-curator/tests/browser.spec.cjs'),
                  ('4d5e863a93c6','knowledge-curator/tests/browser.spec.cjs'),
                  ('602e38bb00b9','knowledge-curator/tests/browser.spec.cjs'),
                  ('be3cacc01a79','knowledge-curator/tests/browser.spec.cjs')
              }
              observed={(str(x.get('Commit',''))[:12],x.get('File')) for x in report}
              fingerprints=[x.get('Fingerprint') for x in report]
              print(json.dumps({'audit':'fingerprint_identity','expected_locations':len(report)==5 and observed==expected,'five_distinct_fingerprints':len(fingerprints)==5 and all(isinstance(x,str) and bool(x) for x in fingerprints) and len(set(fingerprints))==5,'expected_rule':all(x.get('RuleID')=='generic-api-key' for x in report),'exceptions_activated':False}))
              PY
            fi
            echo "::error::Gitleaks detected potential secrets; values and locations suppressed"
            exit 1
          elif [ "$result" -ne 0 ]; then
            echo "::error::Gitleaks scan failed (code $result); details suppressed"
            exit "$result"
          fi
          echo "Gitleaks history scan completed without findings"
