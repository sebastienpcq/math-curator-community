name: Knowledge Curator checks
on:
  push:
    paths:
      - 'knowledge-curator/**'
      - '.github/workflows/knowledge-curator-checks.yml'
  pull_request:
    paths:
      - 'knowledge-curator/**'
      - '.github/workflows/knowledge-curator-checks.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check knowledge-curator/app.js
          node --check knowledge-curator/schema.cjs
          node --check knowledge-curator/cli.cjs
          node --test knowledge-curator/tests/catalog.test.cjs
          node knowledge-curator/cli.cjs list
