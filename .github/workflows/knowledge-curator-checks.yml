name: Knowledge Curator checks
on:
  push:
    paths:
      - 'knowledge-curator/**'
      - '.github/workflows/knowledge-curator-checks.yml'
  pull_request:
    paths:
      - 'knowledge-curator/**'
      - '.github/workflows/knowledge-curator-checks.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          python3 -m py_compile knowledge-curator/agent/local_agent.py
          python3 -m unittest discover -s knowledge-curator/agent -p 'test_*.py'
          node --check knowledge-curator/app.js
          node --check knowledge-curator/learning.cjs
          node --check knowledge-curator/mastery.cjs
          node --check knowledge-curator/attempts.cjs
          node --check knowledge-curator/learning-ui.js
          node --check knowledge-curator/schema.cjs
          node --check knowledge-curator/cli.cjs
          node --test knowledge-curator/tests/*.test.cjs
          node knowledge-curator/cli.cjs list
