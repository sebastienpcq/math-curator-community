name: Math Curator MV3 integration audit
on:
  pull_request:
    branches:
      - agent/youtube-live-validation
      - agent/youtube-client-hardening
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Playwright test runner
        run: |
          npm install --no-save @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Validate MV3 manifest and deterministic scoring
        run: node --test tests/community.test.cjs
      - name: Run real Chromium MV3 fixture tests
        run: npx playwright test knowledge-curator/tests/extension-mv3.spec.cjs knowledge-curator/tests/extension-persistence.spec.cjs --reporter=line --workers=1
