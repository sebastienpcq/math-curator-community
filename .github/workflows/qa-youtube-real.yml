name: Math Curator real YouTube acceptance
on:
  push:
    branches: [agent/qa-youtube-real-20261017]
    paths:
      - '.github/workflows/qa-youtube-real.yml'
      - 'scripts/qa-youtube-real.cjs'
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assert product files match reference SHA
        run: |
          git diff --exit-code d762095dfbf9c6b716acf6a75d903a1b8f5e79f8 HEAD -- manifest.json popup.html options.html src
      - name: Install existing QA dependencies
        run: |
          npm install --no-save @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Diagnose runner and select existing secure sandbox helper
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa-evidence
          {
            id
            uname -r
            for key in kernel.unprivileged_userns_clone kernel.apparmor_restrict_unprivileged_userns user.max_user_namespaces; do
              sysctl "$key" || true
            done
            cat /proc/self/attr/current || true
            if unshare --user --map-root-user true; then
              echo "Unprivileged user namespace probe: PASS"
            else
              echo "Unprivileged user namespace probe: DENIED"
            fi
            sudo aa-status || true
            sudo journalctl -k --since '-5 minutes' --no-pager | grep -E 'apparmor|userns' || true
          } 2>&1 | tee qa-evidence/runner-sandbox-diagnostics.txt
          helper=/opt/google/chrome/chrome-sandbox
          if [ ! -f "$helper" ]; then
            echo "::error::Existing Chrome SUID sandbox helper unavailable; no security policy changed."
            exit 1
          fi
          readlink -f "$helper" | tee -a qa-evidence/runner-sandbox-diagnostics.txt
          stat -Lc '%U %G %a %n' "$helper" | tee -a qa-evidence/runner-sandbox-diagnostics.txt
          test "$(stat -Lc '%u' "$helper")" = 0
          test "$(stat -Lc '%a' "$helper")" = 4755
          echo "CHROME_DEVEL_SANDBOX=$helper" >> "$GITHUB_ENV"
      - name: Prove Chromium starts with sandbox protection
        shell: bash
        run: |
          node <<'JS'
          const {chromium}=require('@playwright/test');
          const fs=require('node:fs');
          (async()=>{
            const browser=await chromium.launch({channel:'chromium',headless:true,chromiumSandbox:true});
            try{
              const page=await browser.newPage();
              await page.goto('chrome://sandbox');
              const status=await page.locator('body').innerText();
              fs.writeFileSync('qa-evidence/chromium-sandbox.txt',browser.version()+'\n'+status);
              console.log(status);
              await page.screenshot({path:'qa-evidence/chromium-sandbox.png'});
              if(!/Seccomp-BPF sandbox\s+Yes/i.test(status))throw Error('Seccomp-BPF sandbox not confirmed');
              if(!/(?:SUID sandbox|Namespace sandbox)\s+Yes/i.test(status))throw Error('Layer-one sandbox not confirmed');
            }finally{await browser.close();}
          })().catch(e=>{console.error(e);process.exitCode=1;});
          JS
      - name: Run bounded acceptance against real YouTube
        run: node scripts/qa-youtube-real.cjs
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: math-curator-real-youtube-evidence
          path: qa-evidence/
          retention-days: 7
          if-no-files-found: warn
